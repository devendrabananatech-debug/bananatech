<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" fill="none">
  <defs>
    <radialGradient id="iconBgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="55%" stop-color="#070A11" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <linearGradient id="bananaGradMax" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="35%" stop-color="#FACC15" />
      <stop offset="70%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <linearGradient id="cyanGradMax" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <filter id="glowYellowLg" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="b1" />
      <feComposite in="SourceGraphic" in2="b1" operator="over" />
    </filter>

    <filter id="glowCyanLg" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="b2" />
      <feComposite in="SourceGraphic" in2="b2" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#iconBgGlow)" />
  <circle cx="400" cy="400" r="380" stroke="#FACC15" stroke-opacity="0.1" stroke-width="2" />

  <!-- Ambient light -->
  <circle cx="400" cy="400" r="260" fill="#FACC15" opacity="0.08" filter="blur(70px)" />
  <circle cx="470" cy="330" r="160" fill="#38BDF8" opacity="0.1" filter="blur(50px)" />

  <!-- Massive Centered Symbol -->
  <g transform="translate(400, 400) scale(10.5)">
    <!-- Orbit ring -->
    <circle cx="0" cy="0" r="32" stroke="url(#bananaGradMax)" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.35" />
    <circle cx="0" cy="0" r="25" fill="#090D16" stroke="#1E293B" stroke-width="1.2" />

    <g transform="translate(-24, -24)">
      <path d="M 16 12 C 28 14 34 26 28 36 C 26 39 23 41 21 41 C 20 41 21 38 23 35 C 27 28 22 18 13 15 C 11.5 14.5 13 12 16 12 Z" 
            fill="url(#bananaGradMax)" filter="url(#glowYellowLg)"/>
      
      <path d="M 28 18 L 35 12" stroke="url(#cyanGradMax)" stroke-width="1.8" stroke-linecap="round" />
      <circle cx="28" cy="18" r="3.4" fill="url(#cyanGradMax)" filter="url(#glowCyanLg)" />
      <circle cx="35" cy="12" r="1.8" fill="#FFFFFF" />

      <circle cx="21" cy="26" r="2" fill="#FFFFFF" opacity="0.9" />
    </g>
  </g>
</svg>
