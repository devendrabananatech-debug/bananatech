<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none">
  <defs>
    <linearGradient id="bananaGradHz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="cyanGradHz" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glowHz" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="#070A11" />
  <rect x="12" y="12" width="1176" height="376" rx="24" stroke="#FACC15" stroke-opacity="0.1" stroke-width="1.5" />

  <!-- Logo Mark -->
  <g transform="translate(120, 200) scale(4.5)">
    <circle cx="0" cy="0" r="32" stroke="url(#bananaGradHz)" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.35" />
    <circle cx="0" cy="0" r="25" fill="#090D16" stroke="#1E293B" stroke-width="1.2" />

    <g transform="translate(-24, -24)">
      <path d="M 16 12 C 28 14 34 26 28 36 C 26 39 23 41 21 41 C 20 41 21 38 23 35 C 27 28 22 18 13 15 C 11.5 14.5 13 12 16 12 Z" 
            fill="url(#bananaGradHz)" filter="url(#glowHz)"/>
      <path d="M 28 18 L 35 12" stroke="url(#cyanGradHz)" stroke-width="1.8" stroke-linecap="round" />
      <circle cx="28" cy="18" r="3.2" fill="url(#cyanGradHz)" />
      <circle cx="35" cy="12" r="1.8" fill="#FFFFFF" />
      <circle cx="21" cy="26" r="2" fill="#FFFFFF" opacity="0.9" />
    </g>
  </g>

  <!-- Typography -->
  <g transform="translate(340, 195)">
    <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="96" font-weight="900" letter-spacing="-2" fill="#FFFFFF">
      BANANA<tspan fill="#FACC15">TECH</tspan><tspan fill="#38BDF8">.</tspan>
    </text>
    <text x="6" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" letter-spacing="10" fill="#94A3B8">
      DIGITAL PRODUCT STUDIO
    </text>
  </g>
</svg>
