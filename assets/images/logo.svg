<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <defs>
    <linearGradient id="bananaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Banana Tech Icon -->
  <g transform="translate(6, 6)">
    <!-- Tech circuit background ring -->
    <circle cx="24" cy="24" r="22" stroke="url(#bananaGrad)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.35"/>
    <circle cx="24" cy="24" r="17" fill="#0B132B" stroke="#1E293B" stroke-width="1.5"/>
    
    <!-- Stylized Geometric Tech Banana -->
    <path d="M 16 12 C 28 14 34 26 28 36 C 26 39 23 41 21 41 C 20 41 21 38 23 35 C 27 28 22 18 13 15 C 11.5 14.5 13 12 16 12 Z" 
          fill="url(#bananaGrad)" filter="url(#glow)"/>
    <!-- Cyber Node accent -->
    <circle cx="28" cy="18" r="3" fill="#38BDF8" filter="url(#glow)"/>
    <path d="M28 18 L34 13" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="34" cy="13" r="1.5" fill="#FFFFFF"/>
    <!-- Core pulse dot -->
    <circle cx="21" cy="26" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Typography -->
  <text x="68" y="38" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5" fill="#FFFFFF">
    BANANA<tspan fill="#FACC15">TECH</tspan><tspan fill="#38BDF8" font-size="28">.</tspan>
  </text>
  <text x="70" y="49" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" letter-spacing="2.2" fill="#94A3B8">
    DIGITAL PRODUCT STUDIO
  </text>
</svg>
